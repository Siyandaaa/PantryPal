name: Build and deploy Node.js app to Azure Web App - PantryPalBackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        working-directory: backend
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Detect whether Azure credentials are configured. `secrets` cannot
      # be used directly in an `if:` expression, so we pass it through `env`
      # and expose the result as a step output.
      - name: Check Azure credentials
        id: azure_check
        env:
          CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1C32E0CDE0CE4A3DADD22C5FEEEE21D3 }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            echo "configured=true"  >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure secrets are not configured — skipping deployment."
          fi

      - name: Login to Azure
        if: steps.azure_check.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1C32E0CDE0CE4A3DADD22C5FEEEE21D3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EF8B3B7181D84769AEAAF9C280E03179 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C30573CA68294869AE3E2546B2F173BE }}

      - name: 'Deploy to Azure Web App'
        if: steps.azure_check.outputs.configured == 'true'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'PantryPalBackend'
          slot-name: 'Production'
          package: .
